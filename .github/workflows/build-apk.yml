name: Build StoreHub Android APK

on:
  push:
    branches:
      - feature/storehub-android-apk
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "package*.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Production origin the Android app loads at runtime.
      CAPACITOR_SERVER_URL: https://store-hub-beta.vercel.app
      NEXT_PUBLIC_SITE_URL: https://store-hub-beta.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare Capacitor web dir
        # The app loads the deployed site via server.url, so an empty
        # webDir satisfies `cap sync` without bundling Next.js output.
        run: mkdir -p out

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storehub-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
